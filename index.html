
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO LONGER HUMAN</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px 8px;
  background: #f4efe7;
  color: #392e2b;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

header {
  background: #542f36;
  color: #fff8ed;
  padding: 28px 22px;
  border-radius: 12px;
  margin-bottom: 14px;
}

header h1 {
  margin: 0 0 8px;
  letter-spacing: 2px;
  font-size: 24px;
}

header p { margin: 0; opacity: .85; }

section {
  background: #fffdf9;
  border: 1px solid #e5d9cc;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
}

h2 {
  color: #663b43;
  margin: 0 0 14px;
  font-size: 19px;
}

.cast-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cast-card {
  background: #f7f1e9;
  padding: 13px;
  border-radius: 9px;
}

.cast-card h3 {
  margin: 0 0 8px;
  color: #663b43;
  font-size: 15px;
}

.cast-card p {
  margin: 0;
  line-height: 1.8;
  font-size: 14px;
}

.stats {
  display: flex;
  gap: 10px;
}

.stat {
  flex: 1;
  background: #f7f1e9;
  padding: 13px;
  border-radius: 9px;
  font-size: 13px;
}

.stat strong {
  display: block;
  font-size: 25px;
  color: #663b43;
}

button, select, input {
  font: inherit;
  border: 1px solid #d9c9bb;
  border-radius: 6px;
  padding: 8px;
  background: white;
  color: #392e2b;
}

button {
  background: #663b43;
  color: white;
  border: 0;
  cursor: pointer;
}

button.secondary { background: #8c796e; }
button.delete { background: #a65b56; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.actions button { font-size: 13px; }

#actorFilter {
  width: 100%;
  margin-bottom: 12px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th, td {
  padding: 7px 3px;
  border-bottom: 1px solid #eadfd4;
  text-align: center;
  overflow-wrap: break-word;
}

th {
  background: #f3ebe2;
  color: #663b43;
  font-size: 12px;
}

td input, td select {
  width: 100%;
  min-width: 0;
  padding: 6px 2px;
  font-size: 12px;
}

td input[type="checkbox"] {
  width: 18px;
  height: 18px;
}

td button {
  font-size: 11px;
  padding: 7px 4px;
  white-space: nowrap;
}

.seat-button { background: #8c796e; }
.seat-count { display: block; font-size: 10px; margin-top: 3px; }

.empty-message {
  text-align: center;
  padding: 25px;
  color: #8c796e;
}

/* 좌석 선택 창 */
.seat-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(30, 20, 20, .7);
  padding: 10px;
  overflow-y: auto;
}

.seat-modal.open {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.seat-window {
  width: 100%;
  max-width: 1000px;
  margin: 10px auto;
  padding: 18px;
  background: #fffdf9;
  border-radius: 12px;
}

.seat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.seat-top h2 { margin-bottom: 5px; }

#seatPerformance {
  font-size: 13px;
  color: #8c796e;
}

.stage {
  margin: 16px auto;
  padding: 11px;
  max-width: 400px;
  text-align: center;
  color: white;
  background: #542f36;
  border-radius: 5px;
  letter-spacing: 4px;
}

.seat-legend {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 15px;
  font-size: 12px;
}

.legend-square {
  display: inline-block;
  width: 15px;
  height: 15px;
  border: 1px solid #c9b8aa;
  border-radius: 3px;
  vertical-align: middle;
  margin-right: 4px;
  background: #f7f1e9;
}

.legend-square.selected { background: #663b43; }

.seat-map {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 12px;
}

.seat-block {
  background: #f7f1e9;
  padding: 10px 6px;
  border-radius: 9px;
  min-width: 0;
}

.seat-block h3 {
  text-align: center;
  margin: 0 0 10px;
  color: #663b43;
  font-size: 13px;
}

.seat-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 25px;
  margin: 3px 0;
}

.row-label {
  width: 18px;
  flex-shrink: 0;
  text-align: center;
  color: #8c796e;
  font-size: 10px;
}

.seat {
  width: 22px;
  height: 23px;
  min-width: 22px;
  padding: 0;
  margin: 0;
  border: 1px solid #d4c4b7;
  border-radius: 4px;
  background: #fffdf9;
  color: #663b43;
  font-size: 12px;
  line-height: 21px;
}

.seat.selected {
  background: #663b43;
  border-color: #663b43;
  color: white;
  font-weight: bold;
}

.seat-gap, .pillar {
  width: 22px;
  height: 23px;
  flex-shrink: 0;
}

.pillar {
  border: 1px dashed #b9a89a;
  border-radius: 3px;
  background: #e6ddd3;
}

.seat-bottom {
  margin-top: 16px;
  padding-top: 13px;
  border-top: 1px solid #eadfd4;
}

#selectedSeatText {
  color: #663b43;
  font-weight: bold;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  margin: 8px 0 12px;
}

.seat-bottom button { margin: 3px; }

/* 휴대폰 화면 */
@media(max-width:600px) {
  body { padding: 7px 4px; }

  header {
    padding: 20px 14px;
    margin-bottom: 9px;
  }

  header h1 { font-size: 20px; }

  section {
    padding: 10px 5px;
    margin-bottom: 9px;
    border-radius: 9px;
  }

  h2 {
    font-size: 16px;
    margin-left: 4px;
  }

  .cast-card { padding: 9px 6px; }
  .cast-card h3 { font-size: 13px; }
  .cast-card p { font-size: 12px; }

  .stat { padding: 10px; }
  .stat strong { font-size: 22px; }

  .actions { gap: 4px; }
  .actions button { padding: 8px 6px; font-size: 11px; }

  th {
    font-size: 10px;
    padding: 6px 1px;
  }

  td { padding: 5px 1px; }

  td input, td select {
    font-size: 10px;
    padding: 5px 1px;
    border-radius: 4px;
  }

  td button {
    font-size: 10px;
    padding: 6px 2px;
  }

  td input[type="checkbox"] {
    width: 16px;
    height: 16px;
  }

  /* 표의 각 칸 너비 */
  th:nth-child(1) { width: 19%; }
  th:nth-child(2) { width: 11%; }
  th:nth-child(3),
  th:nth-child(4),
  th:nth-child(5) { width: 12%; }
  th:nth-child(6) { width: 7%; }
  th:nth-child(7) { width: 17%; }
  th:nth-child(8) { width: 10%; }

  .seat-window { padding: 12px 5px; }

  .seat-map {
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .seat-block {
    width: 100%;
    max-width: 360px;
    padding: 10px 4px;
  }

  .seat-row { gap: 3px; }

  .seat, .seat-gap, .pillar {
    width: 23px;
    min-width: 23px;
    height: 25px;
  }

  .seat { line-height: 23px; }

  .row-label { width: 20px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>NO LONGER HUMAN</h1>
  <p>인간실격 · MY THEATRE RECORD</p>
</header>

<section>
  <h2>CAST MEMBERS</h2>
  <div class="cast-grid">
    <div class="cast-card">
      <h3>다자이 오사무</h3>
      <p>안재영<br>박정원<br>정재환</p>
    </div>
    <div class="cast-card">
      <h3>안고</h3>
      <p>강정우<br>손유동<br>반정모</p>
    </div>
    <div class="cast-card">
      <h3>오타 시즈코</h3>
      <p>한수야<br>김주연<br>박새힘</p>
    </div>
  </div>
</section>

<section>
  <h2>MY RECORD</h2>
  <div class="stats">
    <div class="stat">
      <strong id="totalCount">0</strong>
      전체 공연 기록
    </div>
    <div class="stat">
      <strong id="watchedCount">0</strong>
      나의 관극 횟수
    </div>
  </div>
</section>

<section>
  <h2>PERFORMANCE SCHEDULE</h2>

  <div class="actions">
    <button onclick="addRow()">+ 일정 추가</button>
    <button class="secondary" onclick="exportData()">기록 저장</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">기록 불러오기</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
  </div>

  <select id="actorFilter" onchange="render()">
    <option value="">전체 배우 보기</option>
  </select>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>시간</th>
          <th>다자이</th>
          <th>안고</th>
          <th>시즈코</th>
          <th>관극</th>
          <th>좌석</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>
</section>

</div>

<div class="seat-modal" id="seatModal">
  <div class="seat-window">
    <div class="seat-top">
      <div>
        <h2>MY SEAT</h2>
        <p id="seatPerformance"></p>
      </div>
      <button class="secondary" onclick="closeSeatMap()">닫기</button>
    </div>

    <div class="stage">STAGE</div>

    <div class="seat-legend">
      <span><span class="legend-square"></span>선택 가능</span>
      <span><span class="legend-square selected"></span>내 좌석</span>
      <span><span class="legend-square" style="background:#e6ddd3"></span>기둥</span>
    </div>

    <div class="seat-map">
      <div class="seat-block">
        <h3>LEFT BLOCK</h3>
        <div id="leftSeats"></div>
      </div>

      <div class="seat-block">
        <h3>CENTER BLOCK</h3>
        <div id="centerSeats"></div>
      </div>

      <div class="seat-block">
        <h3>RIGHT BLOCK</h3>
        <div id="rightSeats"></div>
      </div>
    </div>

    <div class="seat-bottom">
      <p>선택한 좌석</p>
      <div id="selectedSeatText">선택한 좌석이 없습니다.</div>
      <button class="secondary" onclick="clearSeats()">선택 초기화</button>
      <button onclick="saveSeats()">좌석 저장</button>
    </div>
  </div>
</div>

<script>
const cast = {
  dazai: ["안재영", "박정원", "정재환"],
  ango: ["강정우", "손유동", "반정모"],
  shizuko: ["한수야", "김주연", "박새힘"]
};

let records = [];

try {
  records = JSON.parse(localStorage.getItem("nlh_records") || "[]");
  if (!Array.isArray(records)) records = [];
} catch (e) {
  records = [];
}

const newSchedule = [
  {date:"2026-12-11",time:"20:00",dazai:"안재영",ango:"강정우",shizuko:"김주연"},
  {date:"2026-12-12",time:"19:00",dazai:"박정원",ango:"손유동",shizuko:"박새힘"},
  {date:"2026-12-13",time:"18:00",dazai:"정재환",ango:"반정모",shizuko:"한수야"},
  {date:"2026-12-15",time:"20:00",dazai:"안재영",ango:"반정모",shizuko:"박새힘"},
  {date:"2026-12-16",time:"20:00",dazai:"박정원",ango:"손유동",shizuko:"김주연"},
  {date:"2026-12-17",time:"20:00",dazai:"정재환",ango:"강정우",shizuko:"박새힘"},
  {date:"2026-12-18",time:"20:00",dazai:"박정원",ango:"반정모",shizuko:"한수야"},
  {date:"2026-12-19",time:"15:00",dazai:"안재영",ango:"강정우",shizuko:"김주연"},
  {date:"2026-12-19",time:"19:00",dazai:"박정원",ango:"손유동",shizuko:"박새힘"},
  {date:"2026-12-20",time:"14:00",dazai:"정재환",ango:"반정모",shizuko:"김주연"},
  {date:"2026-12-20",time:"18:00",dazai:"안재영",ango:"강정우",shizuko:"한수야"}
];

newSchedule.forEach(item => {
  const existing = records.find(
    r => r.date === item.date && r.time === item.time
  );

  if (existing) {
    ["dazai", "ango", "shizuko"].forEach(key => {
      if (!existing[key]) existing[key] = item[key];
    });
  } else {
    records.push({
      ...item,
      watched: false,
      seat: "",
      seatSelections: []
    });
  }
});

records.forEach(r => {
  if (!Array.isArray(r.seatSelections)) {
    r.seatSelections = [];
  }
});

localStorage.setItem("nlh_records", JSON.stringify(records));

function save() {
  localStorage.setItem("nlh_records", JSON.stringify(records));
  updateStats();
}

function makeOptions(list, selected) {
  return '<option value="">선택</option>' +
    list.map(name =>
      `<option value="${name}" ${selected === name ? "selected" : ""}>${name}</option>`
    ).join("");
}

function addRow() {
  records.push({
    date: "",
    time: "",
    dazai: "",
    ango: "",
    shizuko: "",
    watched: false,
    seat: "",
    seatSelections: []
  });

  save();
  render();
}

function updateRecord(index, field, value) {
  if (!records[index]) return;
  records[index][field] = value;
  save();
}

function deleteRow(index) {
  if (!confirm("이 일정을 삭제할까요?")) return;
  records.splice(index, 1);
  save();
  render();
}

function render() {
  const body = document.getElementById("scheduleBody");
  const filter = document.getElementById("actorFilter").value;
  body.innerHTML = "";

  let shown = 0;

  records.forEach((r, i) => {
    const actors = [r.dazai, r.ango, r.shizuko];
    if (filter && !actors.includes(filter)) return;

    shown++;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input type="date" value="${r.date || ""}" data-field="date"></td>
      <td><input type="time" value="${r.time || ""}" data-field="time"></td>
      <td><select data-field="dazai">${makeOptions(cast.dazai, r.dazai)}</select></td>
      <td><select data-field="ango">${makeOptions(cast.ango, r.ango)}</select></td>
      <td><select data-field="shizuko">${makeOptions(cast.shizuko, r.shizuko)}</select></td>
      <td><input type="checkbox" data-field="watched" ${r.watched ? "checked" : ""}></td>
      <td><button class="seat-button" data-seat="true">좌석 선택</button>
      <span class="seat-count">${(r.seatSelections || []).length}개 선택</span></td>
      <td><button class="delete" data-delete="true">삭제</button></td>
    `;

    tr.querySelectorAll("[data-field]").forEach(input => {
      const field = input.dataset.field;

      input.addEventListener("change", () => {
        const value = input.type === "checkbox"
          ? input.checked
          : input.value;

        updateRecord(i, field, value);
      });
    });

    tr.querySelector("[data-seat]").addEventListener("click", () => {
      openSeatMap(i);
    });

    tr.querySelector("[data-delete]").addEventListener("click", () => {
      deleteRow(i);
    });

    body.appendChild(tr);
  });

  if (!shown) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 8;
    td.className = "empty-message";
    td.textContent = "표시할 공연 일정이 없습니다.";
    tr.appendChild(td);
    body.appendChild(tr);
  }

  updateStats();
}

function updateStats() {
  document.getElementById("totalCount").textContent = records.length;
  document.getElementById("watchedCount").textContent =
    records.filter(r => r.watched).length;
}

function setupFilter() {
  const select = document.getElementById("actorFilter");
  const names = [...cast.dazai, ...cast.ango, ...cast.shizuko];

  select.innerHTML = '<option value="">전체 배우 보기</option>' +
    names.map(name => `<option value="${name}">${name}</option>`).join("");
}

function exportData() {
  const blob = new Blob(
    [JSON.stringify(records, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "no-longer-human-records.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();

      records = data;

      records.forEach(r => {
        if (!Array.isArray(r.seatSelections)) {
          r.seatSelections = [];
        }
      });

      save();
      render();
      alert("기록을 불러왔습니다.");
    } catch {
      alert("올바른 기록 파일이 아닙니다.");
    }

    event.target.value = "";
  };

  reader.readAsText(file);
}

/* 좌석 배치 */
const seatLayout = {
  left: [4,4,4,4,2,3,4,4,4,4,4,4,4,3],
  center: [11,10,11,10,11,10,11,11,11,11,11,11,10,8],
  right: [4,4,4,4,4,4,4,4,4,4,4,4,4,4]
};

let currentRecordIndex = null;
let temporarySeats = [];

function seatId(block, row, localNumber) {
  return `${block}-${row}-${localNumber}`;
}

/* 같은 열에서 블록을 넘어 번호를 이어 붙임 */
function globalSeatNumber(block, row, localNumber) {
  const index = row - 1;
  let number = localNumber;

  if (block === "center" || block === "right") {
    number += seatLayout.left[index];
  }

  if (block === "right") {
    number += seatLayout.center[index];
  }

  return number;
}

function blockName(block) {
  return {
    left: "왼쪽",
    center: "가운데",
    right: "오른쪽"
  }[block];
}

function makeSeat(block, row, localNumber) {
  const id = seatId(block, row, localNumber);
  const selected = temporarySeats.includes(id);
  const number = globalSeatNumber(block, row, localNumber);

  const button = document.createElement("button");
  button.className = "seat" + (selected ? " selected" : "");
  button.textContent = selected ? "✓" : "";
  button.type = "button";
  button.title = `${row}열 ${number}번`;

  button.addEventListener("click", () => toggleSeat(id));

  return button;
}

function makeSeatRows(block, targetId) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";

  seatLayout[block].forEach((count, index) => {
    const rowNumber = index + 1;
    const row = document.createElement("div");
    row.className = "seat-row";

    const label = document.createElement("span");
    label.className = "row-label";
    label.textContent = rowNumber;
    row.appendChild(label);

    if (block === "left" && rowNumber === 5) {
      row.append(makePillar(), makePillar());
    }

    if (block === "left" && rowNumber === 6) {
      row.appendChild(makePillar());
    }

    if (block === "center" && rowNumber === 14) {
      for (let i = 0; i < 4; i++) {
        row.appendChild(makeGap());
      }
    }

    for (let n = 1; n <= count; n++) {
      row.appendChild(makeSeat(block, rowNumber, n));
    }

    target.appendChild(row);
  });
}

function makePillar() {
  const pillar = document.createElement("span");
  pillar.className = "pillar";
  pillar.title = "기둥";
  return pillar;
}

function makeGap() {
  const gap = document.createElement("span");
  gap.className = "seat-gap";
  return gap;
}

function openSeatMap(index) {
  currentRecordIndex = index;
  temporarySeats = [...(records[index].seatSelections || [])];

  const r = records[index];

  document.getElementById("seatPerformance").textContent =
    `${r.date || "날짜 미정"} ${r.time || ""}`;

  document.getElementById("seatModal").classList.add("open");

  makeSeatRows("left", "leftSeats");
  makeSeatRows("center", "centerSeats");
  makeSeatRows("right", "rightSeats");

  updateSelectedSeatText();
}

function toggleSeat(id) {
  if (temporarySeats.includes(id)) {
    temporarySeats = temporarySeats.filter(seat => seat !== id);
  } else {
    temporarySeats.push(id);
  }

  makeSeatRows("left", "leftSeats");
  makeSeatRows("center", "centerSeats");
  makeSeatRows("right", "rightSeats");

  updateSelectedSeatText();
}

function updateSelectedSeatText() {
  const target = document.getElementById("selectedSeatText");

  if (!temporarySeats.length) {
    target.textContent = "선택한 좌석이 없습니다.";
    return;
  }

  const names = temporarySeats.map(id => {
    const [block, row, localNumber] = id.split("-");
    const number = globalSeatNumber(block, Number(row), Number(localNumber));

    return `${blockName(block)} ${row}열 ${number}번`;
  });

  target.textContent = names.join(" / ");
}

function clearSeats() {
  temporarySeats = [];

  makeSeatRows("left", "leftSeats");
  makeSeatRows("center", "centerSeats");
  makeSeatRows("right", "rightSeats");

  updateSelectedSeatText();
}

function saveSeats() {
  if (currentRecordIndex === null) return;

  records[currentRecordIndex].seatSelections = [...temporarySeats];

  records[currentRecordIndex].seat = temporarySeats.map(id => {
    const [block, row, localNumber] = id.split("-");
    const number = globalSeatNumber(block, Number(row), Number(localNumber));
    return `${blockName(block)} ${row}열 ${number}번`;
  }).join(", ");

  save();
  render();
  closeSeatMap();
}

function closeSeatMap() {
  document.getElementById("seatModal").classList.remove("open");
  currentRecordIndex = null;
}

setupFilter();
render();
</script>

</body>
</html>
