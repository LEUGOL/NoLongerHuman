<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO LONGER HUMAN</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 16px;
  background: #f4efe7;
  color: #392e2b;
  font-family: Arial, sans-serif;
}
.container { max-width: 1100px; margin: auto; }
header {
  background: #542f36;
  color: #fff8ed;
  padding: 35px;
  border-radius: 14px;
  margin-bottom: 22px;
}
header h1 { margin: 0 0 8px; letter-spacing: 3px; }
header p { margin: 0; opacity: .8; }
section {
  background: #fffdf9;
  border: 1px solid #e5d9cc;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 20px;
}
h2 { color: #663b43; margin-top: 0; }
.cast-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.cast-card {
  background: #f7f1e9;
  padding: 18px;
  border-radius: 10px;
}
.cast-card h3 { margin: 0 0 10px; color: #663b43; }
.cast-card p { margin: 0; line-height: 1.8; }
.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.stat {
  flex: 1;
  min-width: 130px;
  background: #f7f1e9;
  padding: 16px;
  border-radius: 10px;
}
.stat strong { display: block; font-size: 25px; color: #663b43; }
button, select, input {
  font: inherit;
  border: 1px solid #d9c9bb;
  border-radius: 7px;
  padding: 9px;
  background: white;
  color: #392e2b;
}
button {
  background: #663b43;
  color: white;
  border: 0;
  cursor: pointer;
  margin: 4px 3px 4px 0;
}
button:hover { background: #81545b; }
button.secondary { background: #8c796e; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 850px; }
th, td {
  padding: 9px 7px;
  border-bottom: 1px solid #eadfd4;
  text-align: center;
}
th { background: #f3ebe2; color: #663b43; }
td input, td select { width: 100%; min-width: 90px; }
td input[type="checkbox"] { width: auto; min-width: auto; }
.delete { background: #a65b56; }
.actions { margin-bottom: 12px; }
#actorFilter { margin-bottom: 12px; }
@media(max-width:600px) {
  body { padding: 14px 9px; }
  header { padding: 24px; }
  section { padding: 15px; }
}
</style>
</head>
<body>
<div class="container">

<header>
  <h1>NO LONGER HUMAN</h1>
  <p>인간실격 · MY THEATRE RECORD</p>
</header>

<section>
  <h2>CAST MEMBERS</h2>
  <div class="cast-grid">
    <div class="cast-card">
      <h3>다자이 오사무</h3>
      <p>안재영<br>박정원<br>정재환</p>
    </div>
    <div class="cast-card">
      <h3>안고</h3>
      <p>강정우<br>손유동<br>반정모</p>
    </div>
    <div class="cast-card">
      <h3>오타 시즈코</h3>
      <p>한수야<br>김주연<br>박새힘</p>
    </div>
  </div>
</section>

<section>
  <h2>MY RECORD</h2>
  <div class="stats">
    <div class="stat">
      <strong id="totalCount">0</strong>
      전체 공연 기록
    </div>
    <div class="stat">
      <strong id="watchedCount">0</strong>
      나의 관극 횟수
    </div>
  </div>
</section>

<section>
  <h2>PERFORMANCE SCHEDULE</h2>
  <div class="actions">
    <button onclick="addRow()">+ 일정 추가</button>
    <button class="secondary" onclick="exportData()">기록 저장</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">기록 불러오기</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
  </div>

  <select id="actorFilter" onchange="render()">
    <option value="">전체 배우 보기</option>
  </select>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>시간</th>
          <th>다자이</th>
          <th>안고</th>
          <th>시즈코</th>
          <th>관극</th>
          <th>좌석</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>
</section>

</div>

<script>
const cast = {
  dazai: ["안재영", "박정원", "정재환"],
  ango: ["강정우", "손유동", "반정모"],
  shizuko: ["한수야", "김주연", "박새힘"]
};

let records = [];
try {
  records = JSON.parse(localStorage.getItem("nlh_records") || "[]");
  if (!Array.isArray(records)) records = [];
} catch (e) {
  records = [];
}

function save() {
  localStorage.setItem("nlh_records", JSON.stringify(records));
  updateStats();
}

function makeOptions(list, selected) {
  return '<option value="">선택</option>' +
    list.map(name =>
      `<option value="${name}" ${selected === name ? "selected" : ""}>${name}</option>`
    ).join("");
}

function addRow() {
  records.push({
    date: "",
    time: "",
    dazai: "",
    ango: "",
    shizuko: "",
    watched: false,
    seat: ""
  });
  save();
  render();
}

function updateRecord(index, field, value) {
  if (!records[index]) return;
  records[index][field] = value;
  save();
}

function deleteRow(index) {
  if (!confirm("이 일정을 삭제할까요?")) return;
  records.splice(index, 1);
  save();
  render();
}

function render() {
  const body = document.getElementById("scheduleBody");
  const filter = document.getElementById("actorFilter").value;
  body.innerHTML = "";

  records.forEach((r, i) => {
    const actors = [r.dazai, r.ango, r.shizuko];
    if (filter && !actors.includes(filter)) return;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="date" value="${r.date || ""}" data-field="date"></td>
      <td><input type="time" value="${r.time || ""}" data-field="time"></td>
      <td><select data-field="dazai">${makeOptions(cast.dazai, r.dazai)}</select></td>
      <td><select data-field="ango">${makeOptions(cast.ango, r.ango)}</select></td>
      <td><select data-field="shizuko">${makeOptions(cast.shizuko, r.shizuko)}</select></td>
      <td><input type="checkbox" data-field="watched" ${r.watched ? "checked" : ""}></td>
      <td><input type="text" value="${String(r.seat || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}" data-field="seat" placeholder="좌석"></td>
      <td><button class="delete" data-delete="true">삭제</button></td>
    `;

    tr.querySelectorAll("[data-field]").forEach(input => {
      const field = input.dataset.field;
      const eventName = input.type === "checkbox" ? "change" : "change";
      input.addEventListener(eventName, () => {
        const value = input.type === "checkbox" ? input.checked : input.value;
        updateRecord(i, field, value);
      });
    });

    tr.querySelector("[data-delete]").addEventListener("click", () => deleteRow(i));
    body.appendChild(tr);
  });

  updateStats();
}

function updateStats() {
  document.getElementById("totalCount").textContent = records.length;
  document.getElementById("watchedCount").textContent =
    records.filter(r => r.watched).length;
}

function setupFilter() {
  const select = document.getElementById("actorFilter");
  const names = [...cast.dazai, ...cast.ango, ...cast.shizuko];
  select.innerHTML = '<option value="">전체 배우 보기</option>' +
    names.map(name => `<option value="${name}">${name}</option>`).join("");
}

function exportData() {
  const blob = new Blob(
    [JSON.stringify(records, null, 2)],
    { type: "application/json" }
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "no-longer-human-records.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      records = data;
      save();
      render();
      alert("기록을 불러왔습니다.");
    } catch {
      alert("올바른 기록 파일이 아닙니다.");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

setupFilter();
render();
</script>
</body>
</html>
