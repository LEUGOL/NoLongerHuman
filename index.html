<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO LONGER HUMAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px 8px;background:#f4efe7;color:#392e2b;font-family:Arial,sans-serif}
.container{width:100%;max-width:1000px;margin:auto}
header{background:#542f36;color:#fff8ed;padding:24px 20px;border-radius:10px;margin-bottom:10px}
header h1{margin:0 0 7px;font-size:24px;letter-spacing:2px}
header p{margin:0;font-size:14px;opacity:.85}
section{background:#fffdf9;border:1px solid #e5d9cc;border-radius:10px;padding:14px;margin-bottom:10px}
h2{color:#663b43;margin:0 0 12px;font-size:18px}
.cast-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cast-card{background:#f7f1e9;padding:11px;border-radius:8px}
.cast-card h3{margin:0 0 7px;color:#663b43;font-size:14px}
.cast-card p{margin:0;line-height:1.6;font-size:13px;white-space:nowrap}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#f7f1e9;padding:11px;border-radius:8px;font-size:12px}
.stat strong{display:block;font-size:24px;color:#663b43;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,select{font:inherit;border:0;border-radius:6px;padding:8px 10px}
button{background:#663b43;color:white;cursor:pointer}
button.secondary{background:#8c796e}
.actions button{font-size:12px}
#actorFilter{width:100%;margin-bottom:10px;border:1px solid #d9c9bb;background:#fff}
.table-wrap{width:100%}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:9px 5px;border-bottom:1px solid #eadfd4;text-align:center;vertical-align:middle}
th{background:#f3ebe2;color:#663b43;font-size:12px}
td{font-size:12px;overflow-wrap:anywhere}
td.cast-cell{text-align:left;line-height:1.65}
.cast-cell span{display:inline-block;margin-right:7px;white-space:nowrap}
.cast-role{display:inline-block!important;color:#8c796e;font-size:10px;margin-right:4px}
.date-main{font-weight:bold;color:#663b43;font-size:13px}
.time-main{font-variant-numeric:tabular-nums;white-space:nowrap}
.watched-check{width:19px;height:19px;accent-color:#663b43}
.seat-button{background:#8c796e;font-size:11px;padding:7px 8px;white-space:nowrap}
.empty-message{text-align:center;padding:20px;color:#8c796e}

/* MY SEATS */
.seat-record-list{display:grid;gap:18px}
.seat-record{padding:12px 0 16px;border-bottom:1px solid #eadfd4}
.seat-record:last-child{border-bottom:0}
.seat-record-info{margin-bottom:10px}
.seat-record-date{font-weight:bold;color:#663b43;font-size:14px}
.seat-record-cast{font-size:12px;color:#8c796e;margin-top:4px}
.no-seats{color:#8c796e;font-size:13px;padding:8px 2px}
.mini-stage{margin:8px auto 12px;padding:5px;max-width:260px;text-align:center;color:white;background:#542f36;border-radius:4px;font-size:10px;letter-spacing:3px}
.mini-seat-map{
 display:flex;
 justify-content:center;
 align-items:flex-start;
 gap:9px;
 width:100%;
}

.mini-seat-block{
 background:#f7f1e9;
 padding:7px 5px;
 border-radius:5px;
 min-width:0;
 flex:0 0 auto;
}

.mini-seat-block h4{
 text-align:center;
 margin:0 0 6px;
 color:#663b43;
 font-size:10px;
}

.mini-seat-row{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:2px;
 min-height:14px;
 margin:2px 0;
}

.mini-row-label{
 width:12px;
 flex-shrink:0;
 text-align:center;
 color:#8c796e;
 font-size:8px;
}

.mini-seat{
 width:11px;
 height:13px;
 min-width:11px;
 padding:0;
 margin:0;
 border:1px solid #d4c4b7;
 border-radius:2px;
 background:#fffdf9;
 color:#663b43;
 font-size:8px;
 line-height:11px;
 flex-shrink:0;
}

.mini-seat.selected{
 background:#663b43;
 border-color:#663b43;
 color:white;
 font-weight:bold;
}

.mini-seat-gap,.mini-pillar{
 width:11px;
 height:13px;
 flex-shrink:0;
}
.mini-pillar{border:1px dashed #b9a89a;border-radius:2px;background:#e6ddd3}
.mini-legend{text-align:center;font-size:10px;color:#8c796e;margin-top:8px}
.mini-legend-mark{display:inline-block;width:10px;height:10px;background:#663b43;border-radius:2px;vertical-align:middle;margin-right:4px}

/* 좌석 선택 창 */
.seat-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(30,20,20,.7);padding:8px;overflow-y:auto}
.seat-modal.open{display:flex;justify-content:center;align-items:flex-start}
.seat-window{width:100%;max-width:1000px;margin:8px auto;padding:16px;background:#fffdf9;border-radius:10px}
.seat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seat-top h2{margin-bottom:5px}
#seatPerformance{font-size:13px;color:#8c796e;margin:0}
.stage{margin:14px auto;padding:10px;max-width:400px;text-align:center;color:white;background:#542f36;border-radius:5px;letter-spacing:4px}
.seat-legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:13px;font-size:12px}
.legend-square{display:inline-block;width:15px;height:15px;border:1px solid #c9b8aa;border-radius:3px;vertical-align:middle;margin-right:4px;background:#f7f1e9}
.legend-square.selected{background:#663b43}
.seat-map{display:flex;justify-content:center;align-items:flex-start;gap:8px;width:100%}
.seat-block{background:#f7f1e9;padding:9px 5px;border-radius:8px;min-width:0}
.seat-block h3{text-align:center;margin:0 0 9px;color:#663b43;font-size:13px}
.seat-row{display:flex;align-items:center;justify-content:center;gap:2px;min-height:25px;margin:3px 0}
.row-label{width:18px;flex-shrink:0;text-align:center;color:#8c796e;font-size:10px}
.seat{width:22px;height:23px;min-width:22px;padding:0;margin:0;border:1px solid #d4c4b7;border-radius:4px;background:#fffdf9;color:#663b43;font-size:10px;line-height:21px;flex-shrink:0}
.seat.selected{background:#663b43;border-color:#663b43;color:white;font-weight:bold}
.seat-gap,.pillar{width:22px;height:23px;flex-shrink:0}
.pillar{border:1px dashed #b9a89a;border-radius:3px;background:#e6ddd3}
.seat-bottom{margin-top:16px;padding-top:13px;border-top:1px solid #eadfd4}
#selectedSeatText{color:#663b43;font-weight:bold;font-size:13px;line-height:1.8;overflow-wrap:anywhere;margin:8px 0 12px}
.seat-bottom button{margin:3px}

@media(max-width:600px){
 body{padding:4px 3px}
 header{padding:16px 12px;margin-bottom:7px;border-radius:8px}
 header h1{font-size:18px;letter-spacing:1.5px}
 header p{font-size:11px}
 section{padding:9px 7px;margin-bottom:7px;border-radius:8px}
 h2{font-size:15px;margin:0 0 9px}
 .cast-grid{gap:4px}
 .cast-card{padding:8px 5px}
 .cast-card h3{font-size:10px;margin-bottom:5px}
 .cast-card p{font-size:9px;line-height:1.6;letter-spacing:-.4px}
 .stats{gap:5px}
 .stat{padding:8px 7px;font-size:10px}
 .stat strong{font-size:20px}
 .actions{gap:4px;margin-bottom:8px}
 .actions button{font-size:10px;padding:7px 7px}
 th{font-size:9px;padding:6px 1px}
 td{font-size:10px;padding:7px 2px}
 td.cast-cell{font-size:9px;line-height:1.55}
 .cast-cell span{margin-right:4px}
 .cast-role{font-size:8px}
 .date-main{font-size:10px;white-space:nowrap}
 .time-main{font-size:10px}
 .watched-check{width:16px;height:16px}
 .seat-button{font-size:9px;padding:6px 5px}
 th:nth-child(1){width:21%}
 th:nth-child(2){width:13%}
 th:nth-child(3){width:43%}
 th:nth-child(4){width:10%}
 th:nth-child(5){width:13%}
 .seat-record{padding:10px 0 13px}
 .seat-record-date{font-size:12px}
 .seat-record-cast{font-size:10px}
 .mini-seat-map{gap:4px}
 .mini-seat-block{padding:6px 3px;border-radius:4px}
 .mini-seat-block h4{font-size:9px;margin-bottom:5px}
 .mini-seat-row{gap:2px;min-height:13px;margin:2px 0}
 .mini-row-label{width:10px;font-size:7px}
 .mini-seat{width:10px;min-width:10px;height:12px;font-size:7px;line-height:10px;border-radius:2px}
 .mini-seat-gap,.mini-pillar{width:10px;height:12px}
 .mini-stage{font-size:9px;margin:7px auto 9px}
 .mini-legend{font-size:9px}
 .seat-modal{padding:3px}
 .seat-window{padding:10px 3px;margin:3px auto;border-radius:8px}
 .seat-top{padding:0 5px}
 .seat-top h2{font-size:15px}
 #seatPerformance{font-size:10px}
 .seat-top button{font-size:10px;padding:6px 9px}
 .stage{margin:9px auto;padding:7px;font-size:11px;max-width:75%}
 .seat-legend{gap:7px;font-size:10px;margin-bottom:8px}
 .legend-square{width:12px;height:12px}
 .seat-map{gap:2px;justify-content:center}
 .seat-block{flex:0 0 auto;padding:5px 1px;border-radius:5px}
 .seat-block h3{font-size:9px;margin-bottom:6px;white-space:nowrap}
 .seat-row{gap:1px;min-height:16px;margin:2px 0}
 .row-label{width:11px;font-size:8px}
 .seat{width:12px;min-width:12px;height:15px;font-size:7px;line-height:13px;border-radius:2px;padding:0}
 .seat-gap,.pillar{width:12px;height:15px}
 .seat-bottom{margin-top:10px;padding:9px 5px 0}
 .seat-bottom p{font-size:12px}
 #selectedSeatText{font-size:11px}
 .seat-bottom button{font-size:10px;padding:7px 9px}
}
 /* MY ACTOR COUNT */
.actor-count-list{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:8px;
}
.actor-count-card{
 background:#f7f1e9;
 padding:11px;
 border-radius:8px;
}
.actor-count-card h3{
 margin:0 0 8px;
 color:#663b43;
 font-size:14px;
}
.actor-count-person{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:4px;
 padding:5px 0;
 border-bottom:1px solid #eadfd4;
 font-size:13px;
}
.actor-count-person:last-child{
 border-bottom:0;
}
.actor-count-number{
 color:#663b43;
 font-weight:bold;
 white-space:nowrap;
}

@media(max-width:600px){
 .actor-count-list{gap:4px}
 .actor-count-card{padding:8px 5px}
 .actor-count-card h3{font-size:10px;margin-bottom:5px}
 .actor-count-person{font-size:9px;padding:5px 0}
 .actor-count-number{font-size:9px}
}
 @media(max-width:600px){
 .mini-seat-map{gap:4px}
 .mini-seat-block{padding:6px 3px}
 .mini-seat-block h4{font-size:9px;margin-bottom:5px}
 .mini-seat-row{gap:2px;min-height:13px;margin:2px 0}
 .mini-row-label{width:10px;font-size:7px}
 .mini-seat{
  width:10px;
  min-width:10px;
  height:12px;
  font-size:7px;
  line-height:10px;
 }
 .mini-seat-gap,.mini-pillar{width:10px;height:12px}
}
</style>
</head>
<body>
<div class="container">
<header>
 <h1>NO LONGER HUMAN</h1>
 <p>인간실격 · MY THEATRE RECORD</p>
</header>

<section>
 <h2>CAST MEMBERS</h2>
 <div class="cast-grid">
  <div class="cast-card"><h3>다자이 오사무</h3><p>안재영 · 박정원 · 정재환</p></div>
  <div class="cast-card"><h3>안고</h3><p>강정우 · 손유동 · 반정모</p></div>
  <div class="cast-card"><h3>오타 시즈코</h3><p>한수야 · 김주연 · 박새힘</p></div>
 </div>
</section>

<section>
 <h2>MY RECORD</h2>
 <div class="stats">
  <div class="stat"><strong id="totalCount">0</strong>전체 공연 기록</div>
  <div class="stat"><strong id="watchedCount">0</strong>나의 관극 횟수</div>
 </div>
</section>
<section>
 <h2>MY ACTOR COUNT</h2>
 <div id="actorCountList" class="actor-count-list"></div>
</section>
<section>
 <h2>PERFORMANCE SCHEDULE</h2>
 <div class="actions">
  <button class="secondary" onclick="exportData()">기록 저장</button>
  <button class="secondary" onclick="document.getElementById('importFile').click()">기록 불러오기</button>
  <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
 </div>
 <select id="actorFilter" onchange="render()"><option value="">전체 배우 보기</option></select>
 <div class="table-wrap">
  <table>
   <thead><tr><th>날짜</th><th>시간</th><th>캐스트</th><th>관극</th><th>좌석</th></tr></thead>
   <tbody id="scheduleBody"></tbody>
  </table>
 </div>
</section>

<section>
 <h2>MY SEATS</h2>
 <div id="seatRecordList" class="seat-record-list"></div>
</section>
</div>

<div class="seat-modal" id="seatModal">
 <div class="seat-window">
  <div class="seat-top">
   <div><h2>MY SEAT</h2><p id="seatPerformance"></p></div>
   <button class="secondary" onclick="closeSeatMap()">닫기</button>
  </div>
  <div class="stage">STAGE</div>
  <div class="seat-legend">
   <span><span class="legend-square"></span>선택 가능</span>
   <span><span class="legend-square selected"></span>내 좌석</span>
   <span><span class="legend-square" style="background:#e6ddd3"></span>기둥</span>
  </div>
  <div class="seat-map">
   <div class="seat-block"><h3>LEFT</h3><div id="leftSeats"></div></div>
   <div class="seat-block"><h3>CENTER</h3><div id="centerSeats"></div></div>
   <div class="seat-block"><h3>RIGHT</h3><div id="rightSeats"></div></div>
  </div>
  <div class="seat-bottom">
   <p>선택한 좌석</p>
   <div id="selectedSeatText">선택한 좌석이 없습니다.</div>
   <button class="secondary" onclick="clearSeats()">선택 초기화</button>
  </div>
 </div>
</div>

<script>
const cast = {
 dazai:["안재영","박정원","정재환"],
 ango:["강정우","손유동","반정모"],
 shizuko:["한수야","김주연","박새힘"]
};

let records=[];
try{
 records=JSON.parse(localStorage.getItem("nlh_records")||"[]");
 if(!Array.isArray(records))records=[];
}catch(e){records=[];}

const newSchedule=[
 {date:"2026-12-11",time:"20:00",dazai:"안재영",ango:"강정우",shizuko:"김주연"},
 {date:"2026-12-12",time:"19:00",dazai:"박정원",ango:"손유동",shizuko:"박새힘"},
 {date:"2026-12-13",time:"18:00",dazai:"정재환",ango:"반정모",shizuko:"한수야"},
 {date:"2026-12-15",time:"20:00",dazai:"안재영",ango:"반정모",shizuko:"박새힘"},
 {date:"2026-12-16",time:"20:00",dazai:"박정원",ango:"손유동",shizuko:"김주연"},
 {date:"2026-12-17",time:"20:00",dazai:"정재환",ango:"강정우",shizuko:"박새힘"},
 {date:"2026-12-18",time:"20:00",dazai:"박정원",ango:"반정모",shizuko:"한수야"},
 {date:"2026-12-19",time:"15:00",dazai:"안재영",ango:"강정우",shizuko:"김주연"},
 {date:"2026-12-19",time:"19:00",dazai:"박정원",ango:"손유동",shizuko:"박새힘"},
 {date:"2026-12-20",time:"14:00",dazai:"정재환",ango:"반정모",shizuko:"김주연"},
 {date:"2026-12-20",time:"18:00",dazai:"안재영",ango:"강정우",shizuko:"한수야"}
];

newSchedule.forEach(item=>{
 const existing=records.find(r=>r.date===item.date&&r.time===item.time);
 if(existing){
  ["dazai","ango","shizuko"].forEach(key=>{if(!existing[key])existing[key]=item[key];});
 }else{
  records.push({...item,watched:false,seat:"",seatSelections:[]});
 }
});
records.forEach(r=>{if(!Array.isArray(r.seatSelections))r.seatSelections=[];});

function save(){
 localStorage.setItem("nlh_records",JSON.stringify(records));
 updateStats();
}

function formatDate(value){
 if(!value)return "날짜 미정";
 const p=value.split("-");
 if(p.length!==3)return value;
 const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
 return `${Number(p[1])}.${Number(p[2])} (${["일","월","화","수","목","금","토"][d.getDay()]})`;
}

function blockName(block){
 return {left:"왼쪽",center:"가운데",right:"오른쪽"}[block];
}

const seatLayout={
 left:[4,4,4,4,2,3,4,4,4,4,4,4,4,3],
 center:[11,10,11,10,11,10,11,11,11,11,11,11,10,8],
 right:[4,4,4,4,4,4,4,4,4,4,4,4,4,4]
};

function seatLayoutValue(block,row,local){
 const index=row-1;
 let n=local;
 if(block==="center"||block==="right")n+=seatLayout.left[index];
 if(block==="right")n+=seatLayout.center[index];
 return n;
}

function seatDescription(id){
 const [block,row,local]=id.split("-");
 return `${blockName(block)} ${row}열 ${seatLayoutValue(block,Number(row),Number(local))}번`;
}

function render(){
 const body=document.getElementById("scheduleBody");
 const filter=document.getElementById("actorFilter").value;
 body.innerHTML="";
 let shown=0;

 records.forEach((r,i)=>{
  const actors=[r.dazai,r.ango,r.shizuko];
  if(filter&&!actors.includes(filter))return;
  shown++;

  const tr=document.createElement("tr");

  const date=document.createElement("td");
  date.innerHTML=`<span class="date-main">${formatDate(r.date)}</span>`;

  const time=document.createElement("td");
  time.innerHTML=`<span class="time-main">${r.time||"-"}</span>`;

  const castCell=document.createElement("td");
  castCell.className="cast-cell";
  castCell.innerHTML=`<span><i class="cast-role">다자이</i>${r.dazai||"-"}</span><span><i class="cast-role">안고</i>${r.ango||"-"}</span><span><i class="cast-role">시즈코</i>${r.shizuko||"-"}</span>`;

  const watched=document.createElement("td");
  const check=document.createElement("input");
  check.type="checkbox";
  check.className="watched-check";
  check.checked=!!r.watched;
  check.setAttribute("aria-label","관극 여부");
  check.addEventListener("change",()=>{
   records[i].watched=check.checked;
   save();
  });
  watched.appendChild(check);

  const seat=document.createElement("td");
  const seatButton=document.createElement("button");
  seatButton.className="seat-button";
  seatButton.textContent="좌석 선택";
  seatButton.addEventListener("click",()=>openSeatMap(i));
  seat.appendChild(seatButton);

  [date,time,castCell,watched,seat].forEach(td=>tr.appendChild(td));
  body.appendChild(tr);
 });

 if(!shown){
  const tr=document.createElement("tr");
  const td=document.createElement("td");
  td.colSpan=5;
  td.className="empty-message";
  td.textContent="표시할 공연 일정이 없습니다.";
  tr.appendChild(td);
  body.appendChild(tr);
 }

 updateStats();
 renderSeatRecords();
}

function updateStats(){
 document.getElementById("totalCount").textContent=records.length;
 document.getElementById("watchedCount").textContent=records.filter(r=>r.watched).length;

 renderActorCounts();
}

function renderActorCounts(){
 const target=document.getElementById("actorCountList");
 if(!target)return;

 target.innerHTML="";

 const roles=[
  {title:"다자이 오사무",key:"dazai"},
  {title:"안고",key:"ango"},
  {title:"오타 시즈코",key:"shizuko"}
 ];

 roles.forEach(role=>{
  const card=document.createElement("div");
  card.className="actor-count-card";

  const heading=document.createElement("h3");
  heading.textContent=role.title;
  card.appendChild(heading);

  cast[role.key].forEach(actor=>{
   const count=records.filter(r=>
    r.watched===true && r[role.key]===actor
   ).length;

   const person=document.createElement("div");
   person.className="actor-count-person";

   const name=document.createElement("span");
   name.textContent=actor;

   const number=document.createElement("span");
   number.className="actor-count-number";
   number.textContent=count+"회";

   person.append(name,number);
   card.appendChild(person);
  });

  target.appendChild(card);
 });
}

function setupFilter(){
 const select=document.getElementById("actorFilter");
 const names=[...cast.dazai,...cast.ango,...cast.shizuko];
 select.innerHTML='<option value="">전체 배우 보기</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join("");
}

/* MY SEATS 좌석표 만들기 */
function createMiniSeat(block,row,local,seatCounts){
 const id=seatId(block,row,local);
 const count=seatCounts[id]||0;

 const seat=document.createElement("div");
 seat.className="mini-seat"+(count>0?" selected":"");
 seat.textContent=count>0?`✓${count}`:"";
 seat.title=seatDescription(id)+(count>0?` · ${count}회`:"");

 return seat;
}

function createMiniPillar(){
 const p=document.createElement("span");
 p.className="mini-pillar";
 return p;
}

function createMiniGap(){
 const g=document.createElement("span");
 g.className="mini-seat-gap";
 return g;
}

function createMiniSeatRows(block,seatCounts){
 const wrapper=document.createElement("div");
 wrapper.className="mini-seat-block";

 const heading=document.createElement("h4");
 heading.textContent=block==="left"?"LEFT":block==="center"?"CENTER":"RIGHT";
 wrapper.appendChild(heading);

 seatLayout[block].forEach((count,index)=>{
  const rowNumber=index+1;
  const row=document.createElement("div");
  row.className="mini-seat-row";

  const label=document.createElement("span");
  label.className="mini-row-label";
  label.textContent=rowNumber;
  row.appendChild(label);

  if(block==="left"&&rowNumber===5){
   row.append(createMiniPillar(),createMiniPillar());
  }
  if(block==="left"&&rowNumber===6){
   row.appendChild(createMiniPillar());
  }
  if(block==="center"&&rowNumber===14){
   for(let i=0;i<4;i++)row.appendChild(createMiniGap());
  }

  for(let n=1;n<=count;n++){
   row.appendChild(createMiniSeat(block,rowNumber,n,seatCounts));
  }

  wrapper.appendChild(row);
 });

 return wrapper;
}

function renderSeatRecords(){
 const target=document.getElementById("seatRecordList");
 target.innerHTML="";

 // 공연별 좌석 선택 횟수 합산
 const seatCounts={};

 records.forEach(r=>{
  const seats=Array.isArray(r.seatSelections)?r.seatSelections:[];

  seats.forEach(id=>{
   seatCounts[id]=(seatCounts[id]||0)+1;
  });
 });

 // 무대 표시
 const stage=document.createElement("div");
 stage.className="mini-stage";
 stage.textContent="STAGE";

 // 전체 좌석표 하나 만들기
 const map=document.createElement("div");
 map.className="mini-seat-map";

 map.append(
  createMiniSeatRows("left",seatCounts),
  createMiniSeatRows("center",seatCounts),
  createMiniSeatRows("right",seatCounts)
 );

 // 안내 문구
 const legend=document.createElement("div");
 legend.className="mini-legend";
 legend.textContent="체크 표시 옆 숫자는 해당 좌석에 앉은 횟수";

 target.append(stage,map,legend);
}

/* 좌석 선택 */
let currentRecordIndex=null;
let temporarySeats=[];

function seatId(block,row,local){
 return `${block}-${row}-${local}`;
}

function globalSeatNumber(block,row,local){
 return seatLayoutValue(block,row,local);
}

function makeSeat(block,row,local){
 const id=seatId(block,row,local);
 const selected=temporarySeats.includes(id);

 const b=document.createElement("button");
 b.className="seat"+(selected?" selected":"");
 b.textContent=selected?"✓":globalSeatNumber(block,row,local);
 b.type="button";
 b.title=`${row}열 ${globalSeatNumber(block,row,local)}번`;
 b.addEventListener("click",()=>toggleSeat(id));

 return b;
}

function makeSeatRows(block,targetId){
 const target=document.getElementById(targetId);
 target.innerHTML="";

 seatLayout[block].forEach((count,index)=>{
  const rowNumber=index+1;
  const row=document.createElement("div");
  row.className="seat-row";

  const label=document.createElement("span");
  label.className="row-label";
  label.textContent=rowNumber;
  row.appendChild(label);

  if(block==="left"&&rowNumber===5){
   row.append(makePillar(),makePillar());
  }
  if(block==="left"&&rowNumber===6){
   row.appendChild(makePillar());
  }
  if(block==="center"&&rowNumber===14){
   for(let i=0;i<4;i++)row.appendChild(makeGap());
  }

  for(let n=1;n<=count;n++){
   row.appendChild(makeSeat(block,rowNumber,n));
  }

  target.appendChild(row);
 });
}

function makePillar(){
 const p=document.createElement("span");
 p.className="pillar";
 p.title="기둥";
 return p;
}

function makeGap(){
 const g=document.createElement("span");
 g.className="seat-gap";
 return g;
}

function openSeatMap(index){
 currentRecordIndex=index;
 temporarySeats=[...(records[index].seatSelections||[])];

 const r=records[index];
 document.getElementById("seatPerformance").textContent=
  `${formatDate(r.date)} ${r.time||""}`;

 document.getElementById("seatModal").classList.add("open");

 makeSeatRows("left","leftSeats");
 makeSeatRows("center","centerSeats");
 makeSeatRows("right","rightSeats");

 updateSelectedSeatText();
}

function toggleSeat(id){
 temporarySeats=temporarySeats.includes(id)
  ?temporarySeats.filter(x=>x!==id)
  :[...temporarySeats,id];

 /* 누를 때마다 즉시 저장 */
 saveCurrentSeats();

 makeSeatRows("left","leftSeats");
 makeSeatRows("center","centerSeats");
 makeSeatRows("right","rightSeats");

 updateSelectedSeatText();
 renderSeatRecords();
}

function saveCurrentSeats(){
 if(currentRecordIndex===null)return;

 records[currentRecordIndex].seatSelections=[...temporarySeats];
 records[currentRecordIndex].seat=
  temporarySeats.map(seatDescription).join(", ");

 save();
}

function updateSelectedSeatText(){
 const target=document.getElementById("selectedSeatText");

 target.textContent=temporarySeats.length
  ?temporarySeats.map(seatDescription).join(" / ")
  :"선택한 좌석이 없습니다.";
}

function clearSeats(){
 temporarySeats=[];
 saveCurrentSeats();

 makeSeatRows("left","leftSeats");
 makeSeatRows("center","centerSeats");
 makeSeatRows("right","rightSeats");

 updateSelectedSeatText();
 renderSeatRecords();
}

function closeSeatMap(){
 document.getElementById("seatModal").classList.remove("open");
 currentRecordIndex=null;
}

/* 기록 저장 및 불러오기 */
function exportData(){
 const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="no-longer-human-records.json";
 a.click();
 URL.revokeObjectURL(url);
}

function importData(event){
 const file=event.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!Array.isArray(data))throw new Error();

   records=data;
   records.forEach(r=>{
    if(!Array.isArray(r.seatSelections))r.seatSelections=[];
   });

   save();
   render();
   alert("기록을 불러왔습니다.");
  }catch(e){
   alert("올바른 기록 파일이 아닙니다.");
  }

  event.target.value="";
 };

 reader.readAsText(file);
}

/* 시작 */
localStorage.setItem("nlh_records",JSON.stringify(records));
setupFilter();
render();
</script>
